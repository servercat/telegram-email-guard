services:
  app:
    build: .
    env_file: .env
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      options:
        max-size: 10m
        max-file: '3'
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: guard
      POSTGRES_USER: guard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U guard']
      interval: 5s
    restart: unless-stopped
  caddy:
    image: caddy:2-alpine
    ports: ['80:80', '443:443']
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-verify.example.com}
    restart: unless-stopped
volumes:
  pgdata:
  caddydata:
