<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><style>
:root{color-scheme:light dark;--bg:var(--tg-theme-bg-color,#fff);--fg:var(--tg-theme-text-color,#20264e);--muted:var(--tg-theme-hint-color,#7d83a2);--line:var(--tg-theme-section-separator-color,#e2e5f6);--tint:var(--tg-theme-secondary-bg-color,#eeefff);--accent:#6658ed}*{box-sizing:border-box}body{margin:0;padding:0;background:var(--bg);color:var(--fg);font:14px/1.6 system-ui,sans-serif}.card{padding:18px 20px 14px;background:linear-gradient(155deg,var(--tint),var(--bg) 55%);border:1px solid var(--line);border-radius:20px;min-height:492px;display:flex;flex-direction:column}.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:12px}.logo{width:33px;height:33px;border-radius:11px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#56baff,#5066ff);color:white;font-size:21px}.brand small{font-size:7px;color:var(--muted);display:block;letter-spacing:1px}.hero{height:135px;position:relative;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,#c8d6ff55,transparent 65%)}svg{width:96px;height:96px;filter:drop-shadow(0 6px 6px #535fe526)}h2{font-size:19px;text-align:center;margin:0 0 9px}p{font-size:12px;line-height:1.8;text-align:center;color:var(--muted);margin:0;min-height:57px}.steps{display:flex;margin:19px 0 17px}.step{width:33%;position:relative;text-align:center;color:var(--muted);font-size:10px}.step:before{content:'';height:2px;background:var(--line);position:absolute;top:11px;left:-50%;width:100%}.step:first-child:before{display:none}.step b{display:block;position:relative;width:23px;height:23px;margin:auto auto 5px;border-radius:50%;background:var(--line);font-size:11px;line-height:23px;font-weight:500}.step.active b{background:linear-gradient(130deg,#5baeff,#6857ff);color:#fff}.timer{margin:0 0 13px;display:flex;align-items:center;justify-content:space-between;background:var(--tint);padding:8px 12px;border-radius:11px;color:var(--muted);font-size:11px}.timer b{font-size:16px;color:var(--accent);font-variant-numeric:tabular-nums}.bottom{margin-top:auto}button{cursor:pointer;font:inherit;transition:transform .15s}button:active{transform:scale(.98)}button:disabled{opacity:.65;cursor:default}.primary{height:43px;width:100%;border:0;border-radius:12px;color:#fff;font-size:12px;font-weight:600;background:linear-gradient(110deg,#8671ff,#6054ff);box-shadow:0 6px 14px #6859ff18}.row{display:flex;gap:8px;margin-top:9px}.row button{height:31px;width:50%;border:1px solid var(--line);border-radius:9px;background:var(--bg);font-size:10px;color:var(--accent)}footer{font-size:8px;color:var(--muted);text-align:center;margin-top:12px;padding-bottom:max(2px,env(safe-area-inset-bottom));padding-right:var(--tg-content-safe-area-corner-right,0px)}#notice{font-size:11px;color:var(--muted);text-align:center;min-height:0;margin-top:5px}.spin{animation:turn 1.3s linear infinite}@keyframes turn{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><div class="card"><div class="brand"><span class="logo">➤</span><span>群组邮箱验证<small>TELEGRAM · EMAIL GUARD</small></span></div><div class="hero"><svg id="icon" viewBox="0 0 96 96"><defs><linearGradient id="paint" x2="1" y2="1"><stop id="top" stop-color="#74bcff"/><stop id="end" offset="1" stop-color="#5850ff"/></linearGradient></defs><g id="shape"/></svg></div><h2 id="title">欢迎加入我们的群组！</h2><p id="description">请完成邮箱验证，解锁您的群组发言权限。</p><div class="steps"><div class="step"><b>1</b>打开验证</div><div class="step"><b>2</b>邮箱验证</div><div class="step"><b>3</b>完成验证</div></div><div class="bottom"><div id="timer" class="timer"><span>◷ 剩余验证时间</span><b id="time">--:--</b></div><button id="main" class="primary">立即开始验证</button><div class="row"><button id="refresh">⟳ 刷新状态</button><button id="help">ⓘ 验证帮助</button></div><div id="notice"></div></div><footer>安全守护群组 · 验证信息仅用于身份校验</footer></div><script>
var W=window.TelegramWidget,S={},busy=false,$=function(id){return document.getElementById(id)},paths={shield:'<path d="M48 9 77 21v24c0 20-15 33-29 41C34 78 19 65 19 45V21Z" fill="url(#paint)" stroke="#b4d5ff" stroke-width="2"/><path d="m34 46 10 10 20-22" fill="none" stroke="white" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>',mail:'<rect x="12" y="25" width="72" height="51" rx="10" fill="url(#paint)" stroke="#bddaff" stroke-width="2"/><path d="m14 29 30 25q4 4 8 0l30-25" fill="#edf4ff" stroke="#b4cfff" stroke-width="2"/>',check:'<circle cx="48" cy="48" r="35" fill="url(#paint)"/><path d="m31 48 12 12 24-27" fill="none" stroke="white" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>',clock:'<circle cx="48" cy="48" r="34" fill="url(#paint)"/><circle cx="48" cy="48" r="27" fill="none" stroke="white" stroke-width="3"/><path d="M48 29v21l14 8" fill="none" stroke="white" stroke-width="4" stroke-linecap="round"/>',alert:'<circle cx="48" cy="48" r="35" fill="url(#paint)"/><path d="M48 27v27" stroke="white" stroke-width="7" stroke-linecap="round"/><circle cx="48" cy="67" r="4" fill="white"/>',gear:'<path d="m39 12 18 0 3 11 10 6 11-2 9 16-8 8-1 11 5 10-15 10-10-6-12 1-8 8-16-9 2-12-6-10-10-4V32l11-4 7-8Z" fill="url(#paint)"/><circle cx="48" cy="48" r="13" fill="var(--bg)"/>',loader:'<circle cx="48" cy="48" r="31" fill="none" stroke="#d8dfff" stroke-width="8"/><path d="M48 17a31 31 0 0 1 31 31" fill="none" stroke="#6857ff" stroke-width="8" stroke-linecap="round"/>'};
var copy={WAITING:['欢迎加入我们的群组！','为了维护群组交流环境，请完成邮箱验证，解锁发言权限。','shield','立即开始验证',1],OTP_SENT:['验证码已发送！','请前往 Mini App 输入邮件中的 6 位验证码。','mail','打开验证页面',2],VERIFYING:['正在验证中…','正在安全地确认您的邮箱信息，请稍候。','loader','验证处理中',2],VERIFIED:['邮箱验证成功！','邮箱验证已通过，正在恢复群组权限…','check','查看权限状态',3],EXPIRING:['验证即将过期！','剩余时间不多了，请尽快完成邮箱验证。','clock','立即继续验证',2],EXPIRED:['验证已过期','本次验证已停止，请联系群组管理员确认权限处理状态。','alert','联系群组管理员',0],SYSTEM_ERROR:['系统暂时不可用','服务正在恢复，这不代表验证失败。请稍后刷新重试。','gear','刷新验证状态',0]};
function render(){var c=copy[S.state]||copy.WAITING;var color=c[2]==='check'?['#5de2a5','#12b875']:c[2]==='clock'?['#ffd17b','#ff922e']:c[2]==='alert'?['#ff99ac','#f14b69']:c[2]==='gear'?['#bec7df','#7a85a9']:['#74bcff','#5850ff'];$('top').setAttribute('stop-color',color[0]);$('end').setAttribute('stop-color',color[1]);$('title').textContent=c[0];$('description').textContent=S.status==='UNMUTED'?'群组权限已恢复，现在可以正常发言了。':c[1]+(S.email&&S.state==='OTP_SENT'?' 已发送至 '+S.email:'');$('shape').innerHTML=paths[c[2]];$('icon').setAttribute('class',c[2]==='loader'?'spin':'');$('main').textContent=c[3];$('main').disabled=S.state==='VERIFYING'||busy;$('refresh').disabled=busy;var steps=document.querySelectorAll('.step');for(var i=0;i<steps.length;i++)steps[i].className='step'+(i<c[4]?' active':'');$('timer').style.display=['WAITING','OTP_SENT','EXPIRING'].indexOf(S.state||'WAITING')>=0?'flex':'none';tick()}
function read(){try{S=JSON.parse(W.chatData)||{}}catch(e){S={state:'SYSTEM_ERROR'}}render()}
function tick(){var n=S.expiresAt?Math.max(0,Math.ceil((S.expiresAt-Date.now())/1000)):0;$('time').textContent=('0'+Math.floor(n/60)).slice(-2)+':'+('0'+n%60).slice(-2);if(n===0&&S.expiresAt&&S.state!=='VERIFIED')$('notice').textContent='时间已结束，请刷新确认最新状态。'}
function request(action){if(!W){$('notice').textContent='请在 Telegram 内使用此卡片';return}if(busy)return;busy=true;var p=W.request(action);render();$('notice').textContent='正在查询…';p.then(function(a){busy=false;$('notice').textContent=a.result||'状态已刷新';read()},function(e){busy=false;$('notice').textContent='暂时无法处理（'+e.code+'），请稍后重试';render()})}
$('main').onclick=function(){if(S.state==='EXPIRED'&&S.adminUrl){W.openTelegramLink(S.adminUrl);return}request(S.state==='SYSTEM_ERROR'?'refresh':'open')};$('refresh').onclick=function(){request('refresh')};$('help').onclick=function(){if(S.state==='EXPIRED'&&S.adminUrl&&W){W.openTelegramLink(S.adminUrl);return}$('notice').textContent='请通过下方 Mini App 按钮，在 15 分钟内完成邮箱验证。'};if(W){W.onEvent('chatDataChanged',read);W.onEvent('themeChanged',render);read();W.ready()}else render();setInterval(tick,1000);
</script></body></html>
